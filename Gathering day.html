<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>三只小狗的聚会时间表 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .rest-all { background: linear-gradient(135deg, #FFD700 0%, #FF8C00 100%) !important; color: white !important; font-weight: bold; transform: scale(1.05); box-shadow: 0 4px 12px rgba(255, 140, 0, 0.4); z-index: 10; }
        .day-card { aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; font-size: 0.85rem; position: relative; background: #fff; border: 1px solid #f1f5f9; }
        .is-holiday::after { content: '休'; position: absolute; top: 2px; right: 4px; font-size: 9px; color: #ef4444; font-weight: bold; }
        .is-workday::after { content: '班'; position: absolute; top: 2px; right: 4px; font-size: 9px; color: #64748b; font-weight: bold; }
        .today { outline: 2px solid #3b82f6; outline-offset: -2px; }
        /* 针对手机端优化 */
        body { -webkit-tap-highlight-color: transparent; }
        .scroll-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-10">
    <div class="max-w-md mx-auto p-4">
        <header class="bg-white rounded-3xl p-6 shadow-sm mb-4 text-center border border-slate-100">
            <h1 class="text-xl font-extrabold tracking-tight">🗓️ 三只小狗的聚会日</h1>
            <p class="text-[10px] text-slate-400 mt-1">2026年版 </p>
        </header>

        <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-6 px-2">
                <button onclick="changeMonth(-1)" class="p-2 text-slate-400 text-lg">◀</button>
                <h2 id="monthTitle" class="text-lg font-bold">2026年 3月</h2>
                <button onclick="changeMonth(1)" class="p-2 text-slate-400 text-lg">▶</button>
            </div>
            <div class="grid grid-cols-7 gap-2 mb-2 text-center text-[10px] font-bold text-slate-400 uppercase">
                <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            <div id="calendarDays" class="grid grid-cols-7 gap-2 text-center"></div>
        </div>

        <div class="mt-4 bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
            <h3 class="font-bold text-sm mb-3">➕ 自由增加额外休息</h3>
            <div class="space-y-3">
                <select id="extraName" class="w-full border border-slate-200 rounded-xl px-3 py-3 text-sm bg-slate-50 focus:outline-none">
                    <option value="CPR">陈沛冉 (8天轮换)</option>
                    <option value="QY">秦玥 (法定/调休)</option>
                    <option value="SHT">申浩童 (单周四五/双周六日)</option>
                </select>
                <div class="flex gap-2">
                    <input type="date" id="startDate" class="flex-1 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
                    <span class="self-center text-slate-300 text-xs">至</span>
                    <input type="date" id="endDate" class="flex-1 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
                </div>
                <button onclick="addBatchExtra()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-sm shadow-lg shadow-blue-100 active:scale-95 transition-transform">确认同步到排班表</button>
            </div>
        </div>

        <div class="mt-4 bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
            <h3 class="font-bold text-sm mb-3 flex justify-between items-center">
                🕒 休息变动日志
                <span id="logCount" class="text-[10px] bg-slate-100 px-2 py-0.5 rounded-full text-slate-500">0 条记录</span>
            </h3>
            <div id="extraList" class="space-y-2 max-h-48 overflow-y-auto pr-1 scroll-hide">
                </div>
        </div>
    </div>

    <script>
        // 2026 中国法定节假日数据 (含调休补班)
        const holidays2026 = ['2026-01-01','2026-01-02','2026-01-03','2026-02-15','2026-02-16','2026-02-17','2026-02-18','2026-02-19','2026-02-20','2026-02-21','2026-02-22','2026-02-23','2026-04-04','2026-04-05','2026-04-06','2026-05-01','2026-05-02','2026-05-03','2026-05-04','2026-05-05','2026-06-19','2026-06-20','2026-06-21','2026-09-25','2026-09-26','2026-09-27','2026-10-01','2026-10-02','2026-10-03','2026-10-04','2026-10-05','2026-10-06','2026-10-07'];
        const workdays2026 = ['2026-01-04', '2026-02-14', '2026-02-28', '2026-05-09', '2026-09-20', '2026-10-10'];

        let extraRests = JSON.parse(localStorage.getItem('threeFriends_Rests')) || [];
        let viewDate = new Date(); 
        if (viewDate.getFullYear() !== 2026) viewDate = new Date(2026, 2, 1);

        // 修复关键：本地格式化日期，不使用 ISOString
        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function addBatchExtra() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value || start;
            const name = document.getElementById('extraName').value;
            if (!start) return;

            extraRests.push({ start, end, name, id: Date.now() });
            saveAndRender();
            // 清空输入
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
        }

        function removeExtra(id) {
            extraRests = extraRests.filter(item => item.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('threeFriends_Rests', JSON.stringify(extraRests));
            updateLogList();
            renderCalendar();
        }

        function updateLogList() {
            const list = document.getElementById('extraList');
            document.getElementById('logCount').innerText = `${extraRests.length} 条记录`;
            list.innerHTML = extraRests.map(item => `
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100 mb-2">
                    <div>
                        <span class="text-[11px] font-bold text-blue-600">${item.name === 'CPR' ? '陈沛冉' : item.name === 'QY' ? '秦玥' : '申浩童'}</span>
                        <p class="text-[10px] text-slate-500">${item.start} ${item.end !== item.start ? '至 ' + item.end : ''}</p>
                    </div>
                    <button onclick="removeExtra(${item.id})" class="text-red-400 text-xl px-2">×</button>
                </div>
            `).reverse().join('') || '<p class="text-center text-slate-300 py-6 text-xs italic">暂无手动增加记录</p>';
        }

        function isDateInExtra(date, name) {
            const dStr = formatDate(date);
            return extraRests.some(range => name === range.name && dStr >= range.start && dStr <= range.end);
        }

        function isCPRRest(date) {
            const refDate = new Date(2026, 1, 24); // 2026-02-24 为Day 1
            const diff = Math.round((date.setHours(0,0,0,0) - refDate.setHours(0,0,0,0)) / (1000 * 3600 * 24));
            const cycleDay = ((diff % 8) + 8) % 8 + 1;
            return [3, 6, 7, 8].includes(cycleDay) || isDateInExtra(date, 'CPR');
        }

        function isQYRest(date) {
            const dStr = formatDate(date);
            const isWeekend = (date.getDay() === 0 || date.getDay() === 6);
            const isHol = holidays2026.includes(dStr);
            const isWork = workdays2026.includes(dStr);
            return ((isWeekend || isHol) && !isWork) || isDateInExtra(date, 'QY');
        }

        function isSHTRest(date) {
            const refWeek = new Date(2026, 2, 2); // 3月2日所在周为申浩童休周六日的基准
            const diffDays = Math.round((date.setHours(0,0,0,0) - refWeek.setHours(0,0,0,0)) / (1000 * 3600 * 24));
            const weekNum = Math.floor(diffDays / 7);
            const dayInWeek = date.getDay(); 
            let isBaseRest = (weekNum % 2 === 0) ? (dayInWeek === 0 || dayInWeek === 6) : (dayInWeek === 4 || dayInWeek === 5);
            return isBaseRest || isDateInExtra(date, 'SHT');
        }

        function changeMonth(step) {
            viewDate.setMonth(viewDate.getMonth() + step);
            renderCalendar();
        }

        function renderCalendar() {
            const container = document.getElementById('calendarDays');
            const title = document.getElementById('monthTitle');
            if (!container) return;
            container.innerHTML = '';
            
            const y = viewDate.getFullYear(), m = viewDate.getMonth();
            title.innerText = `${y}年 ${m + 1}月`;
            
            const firstDay = new Date(y, m, 1).getDay();
            const daysInM = new Date(y, m + 1, 0).getDate();
            const todayStr = formatDate(new Date());

            for (let i = 0; i < firstDay; i++) container.innerHTML += '<div></div>';
            
            for (let d = 1; d <= daysInM; d++) {
                const curr = new Date(y, m, d);
                const ds = formatDate(curr);
                const cpr = isCPRRest(new Date(y, m, d)), qy = isQYRest(new Date(y, m, d)), sht = isSHTRest(new Date(y, m, d));
                const isAll = cpr && qy && sht;
                
                let cls = 'day-card';
                if (isAll) cls += ' rest-all';
                if (ds === todayStr) cls += ' today';
                if (holidays2026.includes(ds)) cls += ' is-holiday';
                if (workdays2026.includes(ds)) cls += ' is-workday';

                container.innerHTML += `<div class="${cls}">${d}${isAll ? '<span class="text-[8px] mt-1 font-bold">🎉聚</span>' : ''}</div>`;
            }
        }

        // 初始化
        saveAndRender();
    </script>
</body>
</html>
